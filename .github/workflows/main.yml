name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge lint
        run: forge lint src

      - name: Run Forge tests
        # Fork tests against real USDC on Base run only when the BASE_RPC_URL secret is set.
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # Coverage uses the default (lighter) fuzz settings to stay fast.
      FOUNDRY_PROFILE: default
      MIN_COVERAGE: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge coverage
        run: forge coverage --no-match-coverage "test|script" --report summary --report lcov

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

      - name: Check coverage threshold
        run: |
          set +e
          summary=$(.github/scripts/coverage-summary.sh lcov.info "$MIN_COVERAGE")
          status=$?
          set -e
          echo "$summary"
          {
            echo "## Coverage (minimum ${MIN_COVERAGE}%)"
            echo
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
